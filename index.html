<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b32">
<title>Hello · Inglés paso a paso</title>
<style>
:root{
 color-scheme:light;
 --bg:#f3f5fa;--card:#fff;--ink:#17243d;--muted:#606d83;
 --line:#dce2ed;--brand:#405bea;--soft:#eef0ff;--ok:#176946;
 --good:#e5f5ec;--bad:#ae303d;--badbg:#fff0f1;--gold:#ffd373;
 --shadow:0 12px 32px #17243d08;
 font:17px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media(prefers-color-scheme:dark){
 :root{
  color-scheme:dark;--bg:#0c1424;--card:#142139;--ink:#eef3fc;
  --muted:#acb9cd;--line:#2a3a55;--brand:#a0b0ff;--soft:#243457;
  --ok:#83dfb0;--good:#153c30;--bad:#ffa1ad;--badbg:#422532;
  --shadow:none
 }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5;cursor:default}
button,input,textarea,select{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,
select:focus-visible,a:focus-visible{outline:3px solid #e5a82c;outline-offset:3px}
button{min-height:46px}
[hidden]{display:none!important}
header,main{max-width:800px;margin:auto;padding:18px}
header{padding-top:calc(20px + env(safe-area-inset-top))}
main{padding-top:0;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.logo{font-weight:900;font-size:1.65rem;letter-spacing:-1px}
.logo span{color:var(--brand)}
.top,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top{justify-content:space-between}
h1,h2,h3,p{margin:0 0 12px}
h1{font-size:clamp(2rem,7vw,3rem);line-height:1.08;letter-spacing:-1.3px}
h2{font-size:1.55rem;line-height:1.2}
h3{font-size:1.1rem}
small,.small{font-size:.85rem}
.muted{color:var(--muted)}
.card{
 background:var(--card);border:1px solid var(--line);
 border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)
}
.hero{background:#172953;color:#fff;border:0;padding:26px}
.hero .muted{color:#cbd7ef}
.tag{
 display:inline-block;border-radius:99px;background:var(--soft);
 color:var(--brand);padding:5px 10px;font-size:.78rem;font-weight:800
}
.hero .tag{background:#ffffff1c;color:#e5ebff}
.btn,.ghost,.choice,.token{
 border:1px solid var(--line);border-radius:13px;
 padding:11px 15px;background:var(--card);color:var(--ink);font-weight:700
}
.btn{background:var(--brand);border-color:transparent;color:#fff}
@media(prefers-color-scheme:dark){.btn{color:#101a32}}
.gold{background:var(--gold);color:#302200;border-color:transparent}
.ghost{background:transparent}
.wide{width:100%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stat{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px}
.stat strong{display:block;font-size:1.4rem}
.unit{text-align:left;display:block;width:100%;height:100%;padding:18px}
.unit .emoji{font-size:1.7rem}
.unit b{display:block;margin:7px 0}
.unit small{display:block;color:var(--muted)}
.done{border-color:var(--ok);background:var(--good)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0}
.progress i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tools button{font-size:.9rem}
.phrase{font-size:clamp(1.5rem,6vw,2rem);font-weight:800;line-height:1.25;margin:16px 0}
.notice{padding:13px 15px;border-left:4px solid var(--gold);background:var(--soft);border-radius:10px;margin:12px 0}
.feedback{padding:14px;border-radius:12px;margin:14px 0}
.feedback.good{background:var(--good);color:var(--ok)}
.feedback.bad{background:var(--badbg);color:var(--bad)}
input,textarea,select{
 width:100%;background:var(--bg);border:1px solid var(--line);
 border-radius:12px;padding:12px;min-height:48px
}
textarea{resize:vertical}
label{display:block;margin:12px 0 5px;font-weight:700}
.check{display:flex;gap:10px;align-items:center;font-weight:400}
.check input{width:20px;min-height:20px}
.choice{display:block;width:100%;text-align:left;margin:10px 0}
.choice.right{background:var(--good);border-color:var(--ok)}
.choice.wrong{background:var(--badbg);border-color:var(--bad)}
.token{margin:4px;padding:8px 12px}
.answer{min-height:70px;border:2px dashed var(--line);border-radius:14px;padding:8px;margin:14px 0}
.bubble{max-width:92%;padding:15px;border-radius:18px;background:var(--soft);margin:14px 0}
.bubble.you{margin-left:auto;background:var(--good)}
.bubble p:last-child{margin-bottom:0}
details summary{cursor:pointer;min-height:44px;padding:8px 0;font-weight:700}
details p{margin-top:8px}
nav{

 background:var(--card);border-top:1px solid var(--line);
 padding-bottom:env(safe-area-inset-bottom)

nav .navin{display:grid;grid-template-columns:repeat(4,1fr);max-width:800px;margin:auto}
nav button{

nav button span{display:block;font-size:1.35rem}
nav button[aria-current]{color:var(--brand);box-shadow:inset 0 3px var(--brand)}
#toast{

audio{width:100%;margin-top:12px}
.sep{height:1px;background:var(--line);margin:18px 0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:360px){.grid{grid-template-columns:1fr}.card{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const $=s=>document.querySelector(s);
const app=$("#app");
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const e=escapeHTML;
const shuffle=a=>{
 const b=[...a];
 for(let i=b.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [b[i],b[j]]=[b[j],b[i]];
 }
 return b;
};
function load(key,fallback){
 try{return JSON.parse(localStorage.getItem(key))??fallback}
 catch{return fallback}
}
const oldCfg=load("en-cfg",{});
const defaults={accent:oldCfg.ac==="en-GB"?"en-GB":"en-US",translation:oldCfg.es!==false,autoplay:false};
const saved=load("hello-v2",{});
const state={
 cfg:{...defaults,...(saved.cfg||{})},
 units:saved.units&&typeof saved.units==="object"?saved.units:{},
 cards:saved.cards&&typeof saved.cards==="object"?saved.cards:{},
 days:Array.isArray(saved.days)?saved.days:[],
 sessions:Number(saved.sessions)||0
};
let storageWarned=false;
function save(){
 try{localStorage.setItem("hello-v2",JSON.stringify(state))}
 catch{
  if(!storageWarned){
   storageWarned=true;
   toast("No se puede guardar en este navegador. Exporta una copia en Ajustes.");
  }
 }
}
function dayKey(){
 const d=new Date();
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function activity(){
 const day=dayKey();
 if(!state.days.includes(day))state.days.push(day);
 save();
}
function toast(text){
 const box=$("#toast");box.textContent=text;box.hidden=false;
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>box.hidden=true,4500);
}
function button(text,fn,cls="ghost"){
 const b=document.createElement("button");
 b.type="button";b.className=cls;b.textContent=text;b.onclick=fn;
 return b;
}
function title(text){
 const h=document.createElement("h1");h.tabIndex=-1;h.textContent=text;
 app.append(h);return h;
}
function card(html=""){
 const d=document.createElement("section");d.className="card";d.innerHTML=html;
 return d;
}
function feedback(parent,ok,text){
 const d=document.createElement("div");
 d.className="feedback "+(ok?"good":"bad");
 d.setAttribute("role","status");d.textContent=text;parent.append(d);return d;
}
function validUnit(id){return U.find(u=>u.id===id)}
function learned(id){return !!state.units[id]?.passed}
function dueCards(){
 return Object.values(state.cards).filter(c=>validUnit(c.unit)&&Number(c.due)<=Date.now());
}
function remember(unit,index,correct){
 const key=`${unit}:${index}`;
 const prev=state.cards[key]||{};
 const stage=correct?Math.min((Number(prev.stage)||0)+1,5):0;
 const days=[0,1,3,7,14,30];
 state.cards[key]={
  unit,index,stage,
  due:Date.now()+(correct?days[stage]*86400000:600000),
  misses:(Number(prev.misses)||0)+(correct?0:1)
 };
 save();
}

/* Audio y micrófono: una operación a la vez. */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,recorder=null,micStream=null,recordTimer=null;
let mediaURLs=[],voices=[],viewId=0,tab="home";
const synthesis=window.speechSynthesis;
function updateVoices(){voices=synthesis?synthesis.getVoices():[]}
if(synthesis){
 updateVoices();
 synthesis.addEventListener("voiceschanged",updateVoices);
}
function stopSpeech(){if(synthesis)synthesis.cancel()}
function speak(text,slow=false){
 if(!synthesis){toast("Este navegador no tiene lectura de voz.");return}
 if(recognition||recorder){toast("Detén el micrófono antes de escuchar.");return}
 stopSpeech();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang=state.cfg.accent;
 utterance.rate=slow?.65:.9;
 const voice=voices.find(v=>v.lang.replace("_","-")===state.cfg.accent)||
  voices.find(v=>/^en[-_]/i.test(v.lang));
 if(voice)utterance.voice=voice;
 utterance.onerror=event=>{
  if(!["interrupted","canceled"].includes(event.error))toast("No se pudo reproducir la voz. Pulsa de nuevo o revisa el volumen.");
 };
 synthesis.speak(utterance);
}

  "network":"El servicio de reconocimiento necesita conexión o no está disponible ahora.",
  "language-not-supported":"El reconocimiento de inglés no está disponible con esta configuración."
 };
 return map[code]||"No se pudo iniciar el reconocimiento. Puedes escribir o usar el dictado del teclado.";
}
function capture(btn,onText,status){
 if(recognition){recognition.stop();return}
 if(recorder){toast("Detén antes la grabación.");return}
 if(!window.isSecureContext){
  status.textContent="El micrófono necesita HTTPS o localhost. Puedes escribir mientras tanto.";return;
 }
 if(!SR){
  status.textContent="Este navegador no ofrece reconocimiento. Usa el dictado del teclado o escribe. La grabación puede funcionar por separado.";return;
 }
 stopSpeech();
 const original=btn.textContent,current=viewId,r=new SR();
 let error=false,gotText=false;
 recognition=r;r.lang=state.cfg.accent;r.interimResults=true;
 r.continuous=false;r.maxAlternatives=1;
 btn.textContent="⏹ Detener";
 btn.setAttribute("aria-pressed","true");
 status.textContent="Escuchando… Di tu respuesta en inglés.";
 r.onresult=event=>{
  if(current!==viewId)return;
  const text=Array.from(event.results).map(x=>x[0].transcript).join(" ");
  gotText=!!text.trim();onText(text);
 };
 r.onerror=event=>{
  error=true;
  if(current===viewId&&event.error!=="aborted")status.textContent=micError(event.error);
 };
 r.onend=()=>{
  if(recognition===r)recognition=null;
  btn.textContent=original;btn.setAttribute("aria-pressed","false");
  if(current===viewId&&!error)
   status.textContent=gotText?"Texto capturado. Revísalo antes de comprobar o enviar.":"No se recibió texto. Puedes volver a intentarlo.";
 };
 try{r.start()}
 catch{
  recognition=null;btn.textContent=original;
  btn.setAttribute("aria-pressed","false");
  status.textContent="No se pudo iniciar el micrófono. Intenta de nuevo o escribe.";
 }
}
function stopRecording(){
 if(recorder&&recorder.state!=="inactive"){
  try{recorder.stop()}catch{}
 }
 if(micStream)micStream.getTracks().forEach(t=>t.stop());
 micStream=null;clearTimeout(recordTimer);
}
function cleanup(){
 viewId++;
 stopSpeech();
 if(recognition){try{recognition.abort()}catch{}recognition=null}
 stopRecording();
 document.querySelectorAll("audio").forEach(a=>a.pause());
 mediaURLs.forEach(url=>URL.revokeObjectURL(url));mediaURLs=[];
}
async function record(btn,output){
 if(recorder){stopRecording();return}
 if(recognition){toast("Detén antes el reconocimiento.");return}
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
  output.textContent="La grabación necesita HTTPS y un navegador compatible. Prueba abriendo la web directamente en Safari o Chrome.";return;
 }
 const current=viewId;
 btn.disabled=true;output.textContent="Solicitando acceso al micrófono…";
 let stream,mr;
 try{
  stopSpeech();
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  if(current!==viewId){stream.getTracks().forEach(t=>t.stop());return}
  micStream=stream;
  const mime=["audio/webm;codecs=opus","audio/mp4","audio/webm"]
   .find(t=>MediaRecorder.isTypeSupported(t));
  mr=new MediaRecorder(stream,mime?{mimeType:mime}:{});
  recorder=mr;
  const chunks=[];
  mr.ondataavailable=event=>{if(event.data.size)chunks.push(event.data)};
  mr.onstop=()=>{
   clearTimeout(recordTimer);
   stream.getTracks().forEach(t=>t.stop());
   if(micStream===stream)micStream=null;
   if(recorder===mr)recorder=null;
   if(current!==viewId)return;
   btn.textContent="⏺ Grabar mi voz";btn.disabled=false;
   output.replaceChildren();
   if(!chunks.length){output.textContent="No se guardó audio. Vuelve a intentarlo.";return}
   const blob=new Blob(chunks,{type:mr.mimeType||chunks[0].type});
   const url=URL.createObjectURL(blob);mediaURLs.push(url);
   const audio=document.createElement("audio");
   audio.controls=true;audio.src=url;
   const caption=document.createElement("p");
   caption.className="muted small";
   caption.textContent="Escucha tu grabación y compárala con el modelo. No se sube a esta app.";
   output.append(caption,audio);
  };
  mr.onerror=()=>{stopRecording();toast("La grabación se interrumpió. Vuelve a intentarlo.")};
  mr.start();btn.disabled=false;btn.textContent="⏹ Parar grabación";
  output.textContent="Grabando. Máximo 30 segundos. Pulsa Parar cuando termines.";
  recordTimer=setTimeout(stopRecording,30000);
 }catch{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(recorder===mr)recorder=null;
  if(micStream===stream)micStream=null;
  if(current!==viewId)return;
  btn.disabled=false;btn.textContent="⏺ Grabar mi voz";
  output.textContent="No se pudo grabar. Revisa el permiso de micrófono y abre la página fuera de marcos o vistas integradas.";
 }
}

/* Equivalencia textual. No es evaluación fonética ni semántica. */
function normal(text){
 let s=String(text).toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").replace(/[‘’]/g,"'");
 const contractions={
  "i'm":"i am","you're":"you are","he's":"he is","she's":"she is",
  "it's":"it is","we're":"we are","they're":"they are",
  "don't":"do not","doesn't":"does not","can't":"cannot",
  "i'd":"i would","that's":"that is","what's":"what is",
  "where's":"where is","here's":"here is","i've":"i have",
  "isn't":"is not","aren't":"are not"
 };
 for(const [a,b] of Object.entries(contractions))
  s=s.replace(new RegExp("\\b"+a+"\\b","g"),b);
 const nums={zero:"0",one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10"};
 return s.replace(/[^a-z0-9\s]/g," ").trim().split(/\s+/)
  .filter(Boolean).map(w=>nums[w]||w).join(" ");
}
function exact(answer,expected,alternatives=[]){
 const n=normal(answer);
 return [expected,...alternatives].some(x=>normal(x)===n);
}
function similarity(target,heard){
 const a=normal(target).split(" ").filter(Boolean);
 const b=normal(heard).split(" ").filter(Boolean);
 if(!a.length)return 0;
 const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
 for(let i=0;i<=a.length;i++)d[i][0]=i;
 for(let j=0;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
  d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return Math.max(0,Math.round(100*(1-d[a.length][b.length]/Math.max(a.length,b.length))));
}

/* La nota usa TODAS las preguntas. Saltar es incorrecto.
   Solo una evaluación completa puede superar una unidad. */
let test=null;
function makeQuestions(u){
 const questions=[];
 u.p.forEach((p,index)=>{
  questions.push({type:"meaning",index,p});
  questions.push({type:index%2?"write":"order",index,p});
 });
 questions.push({type:"dict",index:0,p:u.p[0]});
 return shuffle(questions);
}
function startTest(id){
 const u=validUnit(id);
 test={id,questions:makeQuestions(u),at:0,results:[]};
 renderTest();
}
function renderTest(){
 if(!test)return;
 if(test.at>=test.questions.length){finishTest();return}
 begin("units");
 const q=test.questions[test.at],u=validUnit(test.id);
 app.append(button("✕ Salir de la evaluación",()=>unitDetail(test.id)));
 const box=card(`
  <span class="tag">EVALUACIÓN · ${test.at+1}/${test.questions.length}</span>
  <div class="progress"><i style="width:${100*test.at/test.questions.length}%"></i></div>
  <h2>${e(u.title)}</h2>
 `);
 app.append(box);
 let answered=false;
 const controls=document.createElement("div");controls.className="tools";
 const skip=button("Saltar · cuenta como error",()=>answer(false));
 function answer(ok){
  if(answered)return;answered=true;
  if(recognition){try{recognition.abort()}catch{}recognition=null}
  test.results.push(ok);
  remember(test.id,q.index,ok);
  activity();
  box.querySelectorAll("button,input,textarea").forEach(b=>b.disabled=true);
  feedback(box,ok,ok?"✓ Correcto.":`Respuesta de referencia: ${q.p[0]} — ${q.p[1]}`);
  const next=button(test.at===test.questions.length-1?"Ver resultado":"Siguiente →",()=>{
   test.at++;renderTest();
  },"btn");
  controls.replaceChildren(next);next.focus();
 }
 if(q.type==="meaning"){
  box.insertAdjacentHTML("beforeend",`<p class="muted">¿Qué significa esta frase?</p><div class="phrase" lang="en">${e(q.p[0])}</div>`);
  audioTools(box,q.p[0]);
  const options=shuffle([...new Set([q.p[1],...shuffle(u.p.filter(p=>p!==q.p)).slice(0,3).map(p=>p[1])])]);
  options.forEach(option=>{
   const b=button(option,()=>answer(option===q.p[1]),"choice");box.append(b);
  });
 }else if(q.type==="order"){
  box.insertAdjacentHTML("beforeend",`<p class="muted">Ordena las palabras para expresar:</p><h3>${e(q.p[1])}</h3>`);
  const tokens=shuffle(q.p[0].split(/\s+/).map((word,id)=>({word,id})));
  const selected=[];
  const area=document.createElement("div");area.className="answer";
  area.setAttribute("aria-label","Frase ordenada");
  const pool=document.createElement("div");
  const check=button("Comprobar",()=>{
   answer(exact(selected.map(t=>t.word).join(" "),q.p[0],q.p[2]||[]));
  },"btn");
  function draw(){
   area.replaceChildren();pool.replaceChildren();
   selected.forEach((t,i)=>area.append(button(t.word,()=>{selected.splice(i,1);draw()},"token")));
   tokens.filter(t=>!selected.includes(t)).forEach(t=>pool.append(button(t.word,()=>{selected.push(t);draw()},"token")));
   check.disabled=selected.length!==tokens.length;
  }
  box.append(area,pool,check);draw();
 }else{
  if(q.type==="dict"){
   box.insertAdjacentHTML("beforeend",'<h3>Escucha y escribe lo que oyes.</h3><p class="muted">Puedes reproducirlo tantas veces como quieras.</p>');
   audioTools(box,q.p[0]);
  }else{
   box.insertAdjacentHTML("beforeend",`<p class="muted">Escribe esta idea en inglés:</p><div class="phrase">${e(q.p[1])}</div>`);
  }
  const input=document.createElement("textarea");input.rows=2;
  input.placeholder="Tu respuesta en inglés";
  input.setAttribute("aria-label","Tu respuesta en inglés");
  input.setAttribute("autocapitalize","off");input.spellcheck=false;input.lang="en";
  box.append(input);
  box.append(button("Comprobar",()=>{
   if(!input.value.trim()){toast("Escribe una respuesta o pulsa Saltar.");return}
   answer(exact(input.value,q.p[0],q.p[2]||[]));
  },"btn"));
 }
 controls.append(skip);box.append(controls);
 box.insertAdjacentHTML("beforeend",'<p class="muted small" style="margin-top:14px">Se admiten las variantes incluidas en la lección. Una respuesta diferente podría ser válida aunque este ejercicio no la contemple.</p>');

 const info=document.createElement("details");info.className="card";
 info.innerHTML=`<summary>¿Y una conversación libre con IA?</summary>
  <p>Para mantener conversaciones abiertas y recibir correcciones adaptadas hace falta conectar un servicio de IA mediante un servidor que proteja la clave.</p>
  <p>Esta versión no lo incluye: no muestra botones de IA que no funcionan ni coloca claves secretas en el HTML.</p>`;
 app.append(info);
}
function startTalk(id){
 conversation={id,index:0,history:[],independent:0,attempts:0};
 renderTalk();
}
function renderTalk(){
 begin("talk");
 const c=conversation,u=validUnit(c.id);
 app.append(button("‹ Cambiar de situación",talkPicker));
 title(`${u.icon} ${u.title}`);
 if(c.index>=u.d.length){
  const box=card(`
   <h2>¡Has completado la conversación! 🎉</h2>
   <p>Resolviste ${c.independent} de ${u.d.length} turnos con una respuesta admitida y sin abrir la pista.</p>
   <p class="muted">Esto mide práctica guiada, no tu nivel general ni la pronunciación. Prueba ahora a decirlo con menos apoyo.</p>
  `);
  box.append(button("Repetir conversación",()=>startTalk(u.id),"btn"));
  box.append(button("Otra situación",talkPicker));
  app.append(box);return;
 }
 const history=document.createElement("div");
 c.history.forEach(turn=>{
  const d=document.createElement("div");d.className="bubble"+(turn.you?" you":"");
  const who=document.createElement("small");who.className="muted";
  who.textContent=turn.you?"TÚ":"INTERLOCUTOR";
  const text=document.createElement("p");text.lang="en";text.textContent=turn.text;
  d.append(who,text);history.append(d);
 });
 app.append(history);
 const line=u.d[c.index];
 const box=card(`
  <span class="tag">TU TURNO · ${c.index+1}/${u.d.length}</span>
  <div class="bubble"><small class="muted">INTERLOCUTOR</small>
  <p class="phrase" lang="en" style="font-size:1.4rem">${e(line[0])}</p>
  ${state.cfg.translation?`<p class="muted">${e(line[1])}</p>`:""}</div>
  <p>Tu objetivo: <strong>${e(line[3])}</strong></p>
 `);
 audioTools(box,line[0]);
 const input=inputWithMic(box,"Habla o escribe tu respuesta en inglés…");
 let hinted=false,resolved=false;
 const report=document.createElement("div");report.setAttribute("aria-live","polite");
 const hint=button("💡 Necesito una pista",()=>{
  hinted=true;hint.disabled=true;
  const d=document.createElement("div");d.className="notice";
  d.textContent=`Puedes decir: ${line[2]}`;box.append(d);audioTools(d,line[2]);
 });
 function continueTurn(text,independent){
  if(resolved)return;resolved=true;
  if(independent)c.independent++;
  c.history.push({you:false,text:line[0]},{you:true,text});
  c.index++;activity();renderTalk();
 }
 const send=button("Enviar respuesta",()=>{
  const text=input.value.trim();
  if(!text){toast("Di o escribe una respuesta primero.");return}
  if(recognition){try{recognition.abort()}catch{}recognition=null}
  c.attempts++;report.replaceChildren();
  if(exact(text,line[2],line[4]||[])){
   feedback(report,true,"✓ Tu respuesta coincide con una forma admitida.");
   send.disabled=true;hint.disabled=true;input.disabled=true;
   report.append(button("Continuar conversación →",()=>continueTurn(text,!hinted),"btn"));
  }else{
   feedback(report,false,"Tu respuesta no coincide con las variantes de este guion. Eso no demuestra que sea incorrecta. Revisa el modelo o vuelve a intentarlo.");
   report.append(button("Ver modelo y continuar",()=>{
    hinted=true;
    const d=document.createElement("p");d.textContent=`Modelo: ${line[2]}`;
    report.replaceChildren(d);
    audioTools(report,line[2]);
    report.append(button("Continuar con el modelo →",()=>continueTurn(line[2],false),"btn"));
   }));
  }
 },"btn");
 const row=document.createElement("div");row.className="tools";row.append(send,hint);
 box.append(row,report);app.append(box);
 if(state.cfg.autoplay)speak(line[0]);
}

/* Práctica oral transparente y grabación independiente del reconocimiento. */
const sounds=[
 ["TH de think","Pon suavemente la punta de la lengua entre los dientes y deja salir aire. No cierres el paso del aire como al decir una t.",
  "Thank you. I think it's three."],
 ["TH de this","Usa una posición parecida, pero con vibración en la garganta.",
  "This is my mother. They are there."],
 ["V y B","Para v, los dientes superiores rozan el labio inferior. Para b se juntan ambos labios.",
  "The van is very big."],
 ["I breve e I larga","Escucha ship y sheep. No cambia solo la duración: también la posición y tensión de la vocal.",
  "ship, sheep, sit, seat, live, leave"],
 ["S inicial","Comienza directamente con el sonido s, sin añadir una e delante.",
  "I speak Spanish. The school is on this street."],
 ["Consonantes finales","Mantén la consonante final sin añadir una vocal al terminar.",
  "I need help. This is my desk."],
 ["Números del uno al diez","Escucha y repite. Comprueba especialmente three y eight.",
  "one, two, three, four, five, six, seven, eight, nine, ten"]
];
function voice(){
 begin("voice");title("Escucha tu progreso");
 const status=card(`
  <h3>Tu navegador</h3>
  <p class="small">
   Lectura de voz: ${synthesis?"disponible":"no disponible"}<br>
   Reconocimiento: ${SR?"detectado; requiere permiso y servicio compatible":"no detectado"}<br>
   Grabación: ${window.MediaRecorder&&navigator.mediaDevices?"detectada; requiere permiso":"no detectada"}<br>
   Conexión segura: ${window.isSecureContext?"sí":"no; usa HTTPS"}
  </p>
 `);
 app.append(status);
 const box=card(`
  <h2>Tu laboratorio de voz</h2>
  <label for="voiceTarget">Frase que quieres practicar</label>
  <textarea id="voiceTarget" rows="2" lang="en" autocapitalize="off">Hello. My name is Ana.</textarea>
  <p class="muted small">Primero escucha el modelo; después dicta o grábate.</p>
 `);
 const tools=document.createElement("div");tools.className="tools";
 tools.append(
  button("🔊 Modelo",()=>speak($("#voiceTarget").value)),
  button("🐢 Modelo lento",()=>speak($("#voiceTarget").value,true))
 );box.append(tools);
 const input=inputWithMic(box,"Texto reconocido o escrito…");
 const result=document.createElement("div");
 box.append(button("Comparar palabras",()=>{
  const target=$("#voiceTarget").value.trim(),heard=input.value.trim();
  if(!target||!heard){toast("Necesitas una frase modelo y una respuesta.");return}
  const percent=similarity(target,heard);
  result.replaceChildren();
  feedback(result,percent>=80,`${percent}% de coincidencia textual.`);
  const p=document.createElement("p");p.className="muted small";
  p.textContent="No es una nota de pronunciación. Un acento correcto puede transcribirse mal y una pronunciación imprecisa puede reconocerse bien. Si escribiste el texto, solo estás comparando escritura.";
  result.append(p);activity();
 },"btn"));
 box.append(result);
 const recOut=document.createElement("div");
 const rb=button("⏺ Grabar mi voz",()=>record(rb,recOut));
 const row=document.createElement("div");row.className="tools";row.append(rb);
 box.append(row,recOut);app.append(box);
 const safety=document.createElement("details");safety.className="card";
 safety.innerHTML=`<summary>Si el micrófono no funciona</summary>
  <p>1. Abre esta página directamente con HTTPS en Safari o Chrome, no dentro de un artefacto ni un navegador integrado.</p>
  <p>2. Revisa el permiso del micrófono para este sitio en los ajustes del navegador y del dispositivo.</p>
  <p>3. Reconocimiento y grabación son funciones distintas. Puede funcionar una y no la otra.</p>
  <p>4. Si falla el reconocimiento, añade el teclado inglés y usa el dictado del teclado. También puedes escribir.</p>
  <p>El reconocimiento puede depender de internet y del proveedor del navegador. Ninguna web puede saltarse un permiso denegado.</p>`;
 app.append(safety);
 sounds.forEach(([name,tip,phrase])=>{
  const d=card(`<h3>${e(name)}</h3><p class="muted">${e(tip)}</p><p lang="en"><strong>${e(phrase)}</strong></p>`);
  audioTools(d,phrase);
  d.append(button("Practicar esta frase",()=>{
   $("#voiceTarget").value=phrase;input.value="";
   box.scrollIntoView({behavior:"smooth",block:"start"});
   $("#voiceTarget").focus();
  }));
  app.append(d);
 });
}

/* Ajustes, copia de seguridad y conservación de datos originales. */
function settings(){
 const back=tab;begin(back);title("A tu manera");
 const box=card(`
  <label for="accent">Modelo de voz</label>
  <select id="accent">
   <option value="en-US">Estadounidense</option>
   <option value="en-GB">Británico</option>
  </select>
  <label class="check"><input id="translation" type="checkbox"> Mostrar traducciones en guiones y conversaciones</label>
  <label class="check"><input id="autoplay" type="checkbox"> Leer automáticamente los turnos cuando el navegador lo permita</label>
  <p class="muted small">Las voces disponibles dependen del dispositivo. Las pantallas de aprendizaje pueden mostrar español aunque ocultes la ayuda del guion.</p>
 `);
 app.append(box);
 $("#accent").value=state.cfg.accent;
 $("#translation").checked=state.cfg.translation;
 $("#autoplay").checked=state.cfg.autoplay;
 box.append(button("Guardar ajustes",()=>{
  state.cfg={
   accent:$("#accent").value,
   translation:$("#translation").checked,
   autoplay:$("#autoplay").checked
  };
  save();navigate(back);toast("Ajustes guardados.");
 },"btn"));
 const data=card(`
  <h2>Tu progreso es tuyo</h2>
  <p class="muted">Se guarda en este navegador. No se sincroniza entre dispositivos. Una copia permite recuperarlo si borras los datos del sitio.</p>
 `);
 data.append(button("⬇ Exportar mi progreso",()=>{
  const content=JSON.stringify({version:2,data:state},null,2);
  const url=URL.createObjectURL(new Blob([content],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download="hello-progreso.json";
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
 }));
 const label=document.createElement("label");
 label.textContent="Importar una copia de esta versión";
 const file=document.createElement("input");file.type="file";file.accept=".json,application/json";
 file.setAttribute("aria-label","Seleccionar copia de progreso");
 file.onchange=async()=>{
  const f=file.files[0];if(!f)return;
  try{
   if(f.size>1000000)throw new Error();
   const backup=JSON.parse(await f.text()),d=backup.data;
   if(backup.version!==2||!d||typeof d!=="object"||
      !d.units||typeof d.units!=="object"||Array.isArray(d.units)||
      !d.cards||typeof d.cards!=="object"||Array.isArray(d.cards)||
      !Array.isArray(d.days))throw new Error();
   const newUnits={},newCards={};
   U.forEach(u=>{
    const p=d.units[u.id];
    if(p&&typeof p==="object"){
     const best=Math.max(0,Math.min(100,Number(p.best)||0));
     newUnits[u.id]={
      best,passed:p.passed===true&&best>=80,
      last:Math.max(0,Math.min(100,Number(p.last)||0)),
      attempts:Math.max(0,Math.min(100000,Number(p.attempts)||0))
     };
    }
   });
   U.forEach(u=>u.p.forEach((_,index)=>{
    const key=`${u.id}:${index}`,c=d.cards[key];
    if(c&&Number.isFinite(c.due)){
     newCards[key]={
      unit:u.id,index,due:c.due,
      stage:Math.max(0,Math.min(5,Math.floor(Number(c.stage)||0))),
      misses:Math.max(0,Number(c.misses)||0)
     };
    }
   }));
   if(!confirm("Esta copia sustituirá el progreso actual de la versión nueva. ¿Continuar?"))return;
   state.units=newUnits;state.cards=newCards;
   state.days=[...new Set(d.days.filter(x=>typeof x==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x)))];
   state.sessions=Math.max(0,Number(d.sessions)||0);
   if(d.cfg&&typeof d.cfg==="object"){
    state.cfg={
     accent:d.cfg.accent==="en-GB"?"en-GB":"en-US",
     translation:d.cfg.translation!==false,
     autoplay:d.cfg.autoplay===true
    };
   }
   save();home();toast("Copia importada.");
  }catch{toast("La copia no es válida o pertenece a otra versión.")}
 };
 data.append(label,file);app.append(data);
 const legacy=load("en-prog",null);
 const privacy=document.createElement("details");privacy.className="card";
 privacy.innerHTML=`<summary>Datos anteriores y privacidad</summary>
  <p>No se modifican ni borran las claves originales <code>en-cfg</code> y <code>en-prog</code>. La nueva versión utiliza <code>hello-v2</code>.</p>
  <p>${legacy?"Se detectó progreso de la app anterior. No se convierte automáticamente en unidades superadas porque aquella evaluación podía excluir preguntas saltadas.":"Si usaste la versión anterior en otra dirección web, este navegador no permite leer sus datos desde aquí."}</p>
  <p>Esta página no incluye analítica, publicidad ni llamadas a una API de IA. El reconocimiento de voz puede utilizar los servicios del navegador, con sus propias condiciones de privacidad.</p>
  <p>Las grabaciones viven temporalmente en memoria y se liberan al cambiar de pantalla. No las conserves aquí como archivo permanente.</p>`;
 app.append(privacy);
 app.append(button("Volver",()=>navigate(back)));
}

document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
  stopSpeech();
  if(recognition){try{recognition.abort()}catch{}recognition=null}
  stopRecording();
  document.querySelectorAll("audio").forEach(a=>a.pause());
 }
});
window.addEventListener("pagehide",cleanup);
home();
</script>
